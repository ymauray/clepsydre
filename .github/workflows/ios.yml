name: iOS CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  coeur:
    name: Tests du module partagé
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Le cœur se teste sans simulateur ni appareil : c'est la boucle rapide, et elle
      # couvre le décompte, les états d'un bloc, la journée et les notifications.
      - name: swift test
        working-directory: ClepsydreCore
        run: swift test

  application:
    name: Compilation et tests iOS
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Installer XcodeGen
        run: brew install xcodegen

      # Le projet est régénéré depuis project.yml, qui reste la source de vérité même si
      # le .xcodeproj est committé pour Xcode Cloud.
      - name: Générer le projet Xcode
        run: xcodegen generate

      - name: Compiler et tester
        run: |
          UDID=$(xcrun simctl list devices available -j \
            | jq -r '[.devices | to_entries[] | select(.key | contains("iOS")) | .value[]] | first | .udid')
          xcodebuild \
            -project Clepsydre.xcodeproj \
            -scheme Clepsydre \
            -destination "platform=iOS Simulator,id=$UDID" \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            test

  bundle-complet:
    name: Bundle complet (iOS + Watch embarquée)
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Installer XcodeGen
        run: brew install xcodegen

      - name: Générer le projet avec la montre embarquée
        run: xcodegen generate --spec project-avec-montre.yml

      # Ce job reproduit ce que fait Xcode Cloud : il régénère le projet depuis la variante
      # qui embarque l'app Watch, ce que la machine de développement ne peut pas faire faute
      # de SDK watchOS.
      - name: Compiler l'app iOS avec la Watch embarquée
        run: |
          UDID=$(xcrun simctl list devices available -j \
            | jq -r '[.devices | to_entries[] | select(.key | contains("iOS")) | .value[]] | first | .udid')
          xcodebuild \
            -project Clepsydre.xcodeproj \
            -scheme Clepsydre \
            -destination "platform=iOS Simulator,id=$UDID" \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build
